# claude-sync — tag vX.Y.Z: compila para Windows, macOS e Linux e anexa à release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # O build.sh roda os testes, que no Linux precisam de um chaveiro.
      - name: Compilar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11
          export VERSION="${GITHUB_REF_NAME#v}"
          dbus-run-session -- sh -c 'echo -n teste | gnome-keyring-daemon --unlock --components=secrets >/dev/null && GO=go ./build.sh'
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
