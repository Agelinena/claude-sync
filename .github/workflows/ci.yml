# claude-sync — vet e testes a cada push, nos três sistemas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

      # No Linux, a senha vai para o Secret Service (secret-tool). O runner não
      # tem chaveiro: sobe um gnome-keyring desbloqueado numa sessão D-Bus só
      # para os testes.
      - name: Testes (Linux, com chaveiro de teste)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11
          dbus-run-session -- sh -c 'echo -n teste | gnome-keyring-daemon --unlock --components=secrets >/dev/null && go test ./...'
      - name: Testes
        if: runner.os != 'Linux'
        run: go test ./...
